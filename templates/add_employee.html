{% extends "base.html" %}

{% block title %}Add Employee{% endblock %}

{% block content %}

<div class="form-container">

    <h1>Add Employee</h1>

    <form method="POST">

        <label>Name</label>
        <input type="text" name="name" placeholder="Enter employee name" required>

        <label>Email</label>
        <input type="email" name="email" placeholder="Enter employee email" required>

        <label>Department</label>
        <input type="text" name="department" placeholder="Enter department" required>

        <label>Position</label>
        <input type="text" name="position" placeholder="Enter position" required>

        <button type="submit">Add Employee</button>

    </form>

    <br>

    <a href="/employees">Back to Employees</a>

</div>

{% endblock %}
