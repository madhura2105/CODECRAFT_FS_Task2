{% extends "base.html" %}

{% block title %}Edit Employee{% endblock %}

{% block content %}

<div class="form-container">

    <h1>Edit Employee</h1>

    <form method="POST">

        <label>Name</label>
        <input
            type="text"
            name="name"
            value="{{ employee.name }}"
            required
        >

        <label>Email</label>
        <input
            type="email"
            name="email"
            value="{{ employee.email }}"
            required
        >

        <label>Department</label>
        <input
            type="text"
            name="department"
            value="{{ employee.department }}"
            required
        >

        <label>Position</label>
        <input
            type="text"
            name="position"
            value="{{ employee.position }}"
            required
        >

        <button type="submit">Update Employee</button>

    </form>

    <br>

    <a href="/employees">Back to Employees</a>

</div>

{% endblock %}
